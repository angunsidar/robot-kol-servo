; Arduino IDE yerine PlatformIO ile derleme / yükleme:  pio run -d arduino  ·  pio run -d arduino -t upload
[platformio]
src_dir = kol_servo

[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_flags = -Wall -Wextra
lib_deps =
  arduino-libraries/Servo@1.3.0
  slashdevin/NeoSWSerial@3.0.5
monitor_speed = 115200
